name: Tests

# The checks of docs/development.md#checks, on every push to main and every pull
# request: the front's lint, types, unit and end-to-end tests (headless, in the
# runner's Chrome, on the fake API: no server), and the back's build. A failed
# end-to-end run keeps its report (screenshots, traces) as the run's artifact.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tesla-player
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tesla-player/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run e2e

      - name: Keep the end-to-end report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tesla-player/playwright-report
          retention-days: 14

  back:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nest-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nest-backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
